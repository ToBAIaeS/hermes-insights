name: EAS Build

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: EAS Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: EAS Build (iOS Simulator)
        run: eas build --platform ios --profile simulator --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build (Android APK)
        run: eas build --platform android --profile preview --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  production-build:
    name: EAS Production Build
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ endsWith(github.ref, '.0') }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: EAS Build (iOS Production)
        run: eas build --platform ios --profile production --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build (Android Production)
        run: eas build --platform android --profile production --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
